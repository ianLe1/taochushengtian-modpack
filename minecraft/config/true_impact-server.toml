#Basic on/off toggles for casual players: whether blocks break at all,
#whether damage accumulates over multiple hits, and drop behavior.
[general]
	#Whether damaged blocks are actually destroyed. Does NOT gate damage
	#accumulation or crack display -- those are controlled by damageAccumulation below.
	enableBlockBreaking = true
	#Whether damage persists and accumulates across multiple hits (with crack
	#overlays showing intermediate progress). When OFF, there is no accumulated
	#state at all: each hit is judged alone -- if it alone reaches the break
	#threshold the block is destroyed outright (subject to enableBlockBreaking), otherwise
	#nothing happens and no crack is shown.
	damageAccumulation = true
	#Master switch for whether world blocks take damage from impacts
	#(damage accumulation, crack overlay, destruction). Mirrors physicsStructureDamage
	#for physics structures. Does NOT gate surface compaction (grass -> dirt etc.) --
	#see [advanced.compaction], which is independent.
	worldBlockDamage = true
	#Whether physics structures take damage when colliding with terrain.
	physicsStructureDamage = true
	#Whether physics structures take damage when colliding with each other.
	structureVsStructureDamage = true
	#Block drop mode: DISABLED=no drops, BY_FORCE=drops depend on impact energy (see [advanced.mining]), ALL=always drop as if mined by netherite pickaxe.
	#Allowed Values: DISABLED, BY_FORCE, ALL
	dropMode = "BY_FORCE"
	#Chance (0.0-1.0) that a destroyed block actually drops its item, independent of dropMode.
	#Lower this to reduce item-entity and particle load when a lot of blocks break at once.
	# Default: 1.0
	# Range: 0.0 ~ 1.0
	dropChance = 1.0

#Fine-tuning for players who want more control over damage formulas,
#thresholds, logging, and Create integration.
[advanced]

	#Per-material-class break multipliers (brittle/wood/stone/metal/high-strength).
	[advanced.materials]
		#Break multiplier for brittle materials (glass, ice, terracotta). Base threshold: 45 J.
		# Default: 1.0
		# Range: 0.1 ~ 20.0
		brittleBreakMultiplier = 1.0
		#Break multiplier for wood materials (planks, logs). Base threshold: 100 J.
		# Default: 1.0
		# Range: 0.1 ~ 20.0
		woodBreakMultiplier = 1.0
		#Break multiplier for stone materials (stone, cobblestone, concrete). Base threshold: 500 J.
		# Default: 1.0
		# Range: 0.1 ~ 20.0
		stoneBreakMultiplier = 1.0
		#Break multiplier for metal materials (iron, gold, copper). Base threshold: 1800 J.
		# Default: 1.0
		# Range: 0.1 ~ 20.0
		metalBreakMultiplier = 1.0
		#Break multiplier for high-strength materials (obsidian, netherite). Base threshold: 7500 J.
		# Default: 1.0
		# Range: 0.1 ~ 20.0
		highStrengthBreakMultiplier = 1.0

	#Surface-layer compaction (grass -> dirt, farmland -> dirt, etc.) -- a transformation,
	#not damage, so it runs independently of worldBlockDamage.
	[advanced.compaction]
		#Whether impacts compact soft-soil surface blocks into their denser form
		#according to the rules below. Independent of worldBlockDamage: can stay on
		#even with world block damage disabled, and vice versa.
		enableCompaction = true
		#Compaction rules, one per line: "fromBlockId;toBlockId;thresholdJ;probability".
		#An impact on fromBlockId exceeding thresholdJ has probability (0.0-1.0) chance
		#of transforming it into toBlockId. Add/edit/remove lines to add your own rules;
		#a block with no matching rule is left alone by compaction (still accumulates
		#damage and breaks normally). Malformed lines are ignored.
		compactionRules = ["minecraft:grass_block;minecraft:dirt;5.0;1.0", "minecraft:farmland;minecraft:dirt;5.0;1.0", "minecraft:podzol;minecraft:dirt;5.0;1.0", "minecraft:mycelium;minecraft:dirt;5.0;1.0", "minecraft:suspicious_sand;minecraft:sand;5.0;1.0", "minecraft:suspicious_gravel;minecraft:gravel;5.0;1.0"]

	#Tuning for high-energy impacts that punch through terrain layer by layer
	#instead of stopping elastically at first contact.
	[advanced.penetrationDynamics]
		#Penetration dynamics: when a high-energy impact crushes the structure's
		#leading face, leftover kinetic energy is re-injected as velocity so heavy
		#bodies smash THROUGH material layer by layer (meteor craters) instead of
		#stopping elastically at first contact.
		enablePenetration = true
		#Minimum per-contact impact energy (J) to enter penetration mode.
		#Ordinary falls stay in the elastic/crack regime. Default 1200.
		# Default: 1200.0
		# Range: 100.0 ~ 1000000.0
		penetrationTriggerEnergy = 1200.0
		#Cap on re-injected speed (m/s). Above ~50 the engine can tunnel through thin
		#obstacles; excess energy is lost to crushing/heat. Default 30.
		# Default: 30.0
		# Range: 1.0 ~ 50.0
		penetrationMaxSpeed = 30.0
		#Minimum contact speed (m/s) to enter penetration mode — the mass-independent
		#dynamic/static criterion. A heavy body settling 1 block falls at ~4.4 m/s;
		#without this gate its m·g·h energy alone re-triggers penetration every drop,
		#so massive bodies ratchet-sink into soft ground forever. Below this speed
		#the contact is STATIC bearing: Rapier supports the body, nothing is dug.
		#Default 8 (kills ≤2-block settle re-triggers, keeps 20-30 m/s real slams).
		# Default: 8.0
		# Range: 0.0 ~ 30.0
		penetrationMinSpeed = 8.0
		#Energy loss multiplier per crushed layer: E_left = E − Σ(breakJ) × factor.
		#Above 1.0 accounts for terrain-side crushing, deformation and heat.
		#Higher = shallower penetration. Default 2.0.
		# Default: 2.0
		# Range: 1.0 ~ 20.0
		penetrationLossFactor = 2.0
		#Footprint radius (blocks) crushed per penetration layer. Large structures
		#need their WHOLE leading face and the terrain under it cleared, or they
		#rest on intact ground around the single-contact hole and stop dead.
		#Each crushed cell charges its breakJ to the energy budget. 0 = patch only.
		# Default: 8
		# Range: 0 ~ 16
		penetrationFootprintRadius = 8

	#Overall damage intensity preset and the minimum energy needed for any
	#damage to be registered at all.
	[advanced.balance]
		#Damage intensity preset. Multiplied with damageMultipliers.totalDamageMultiplier.
		#MILD=0.3x  CONSERVATIVE=0.6x  DEFAULT=1.0x  INTENSE=2.5x  DRAMATIC=6.0x
		#Allowed Values: MILD, CONSERVATIVE, DEFAULT, INTENSE, DRAMATIC
		damagePreset = "DEFAULT"
		#Minimum impact energy (J) for any damage to be registered. Impacts below this are ignored entirely.
		# Default: 40.0
		# Range: 1.0 ~ 500.0
		detectionThreshold = 40.0

	#Global and per-category damage multipliers, plus physics-structure
	#elastic floor, stress-relaxation decay, and impact-speed cap tuning.
	[advanced.damageMultipliers]
		#Global damage multiplier applied to all impacts. Stacks with damagePreset.
		# Default: 1.0
		# Range: 0.1 ~ 10.0
		totalDamageMultiplier = 1.0
		#Additional damage multiplier applied only to physics structure blocks.
		# Default: 1.0
		# Range: 0.1 ~ 10.0
		physicsStructureDamageMultiplier = 1.0
		#Additional damage multiplier applied only to world blocks.
		# Default: 1.0
		# Range: 0.1 ~ 10.0
		worldBlockDamageMultiplier = 1.0
		#Elastic floor (fatigue limit): a single hit below this fraction of a block's
		#adjusted break threshold causes ZERO damage — purely elastic contact.
		#Prevents gentle repeated contacts (waving a structure) from grinding blocks
		#to destruction via unbounded accumulation. Default 0.2 (20%).
		# Default: 0.2
		# Range: 0.0 ~ 1.0
		physicsStructureElasticFloor = 0.2
		#Stress relaxation half-life in server ticks: accumulated block damage
		#halves every N ticks between hits. Real crashes land within a few ticks
		#(unaffected); scattered sub-critical hits fade instead of stacking forever.
		#0 disables decay. Default 60 (3 seconds).
		# Default: 60
		# Range: 0 ~ 12000
		physicsStructureDamageHalfLife = 60
		#Sanity cap on per-contact velocity change (m/s) for physics structure kImpact.
		#Grab-tool constraint yanks and post-break angular whip can report 100+ m/s,
		#producing absurd energies (400 000+ J observed). kImpact is clamped to
		#0.5 × bodyMass × cap². 0 disables. Default 40 m/s.
		# Default: 40.0
		# Range: 0.0 ~ 1000.0
		physicsStructureMaxImpactSpeed = 40.0

	#Integration toggles for other mods.
	[advanced.compatibility]

		#Create mod dynamic structure (contraption) impact interactions:
		#anchor damage, train derailment, minecart destruction.
		[advanced.compatibility.create]
			#Whether impacts involving Create mod dynamic structures are processed.
			#When enabled, damage is transferred to the anchor block of the dynamic structure
			#(the block/entity that, when destroyed, collapses the structure — e.g. bearings, rails).
			enableContraptionInteraction = true
			#Multiplier applied to the auto-computed anchor break threshold.
			#Threshold = (Σ block breakThresholdJ + anchor breakThresholdJ) × this value.
			#Higher = more durable contraption anchors. Default 1.0 = no scaling.
			# Default: 1.0
			# Range: 0.1 ~ 20.0
			anchorStrengthMultiplier = 1.0
			#Minimum impact energy (J) required to derail a Create train.
			#Default 800 J ≈ a serious collision. Lower = easier to derail.
			# Default: 800.0
			# Range: 1.0 ~ 100000.0
			trainDerailThreshold = 800.0
			#Minimum impact energy (J) required to destroy a minecart contraption.
			#Default 500 J ≈ a moderate-to-heavy collision. Lower = more fragile minecarts.
			# Default: 500.0
			# Range: 1.0 ~ 100000.0
			minecartKillThreshold = 500.0

	#Crack overlay network update timing.
	[advanced.crackOverlay]
		#Minimum ticks between crack overlay updates for the same block. Lower = more responsive but more packet traffic.
		# Default: 10
		# Range: 1 ~ 100
		crackUpdateCooldown = 10

	#Formula coefficients and base thresholds for the damage calculation system.
	[advanced.calibration]
		#Coefficient in crackThresholdJ = clamp(coefficient × blastResist^exponent, min, max).
		# Default: 15.0
		# Range: 0.1 ~ 1000.0
		crackCoefficient = 15.0
		#Exponent in the crackThresholdJ formula. Higher = threshold grows faster with blast resistance.
		# Default: 0.6
		# Range: 0.01 ~ 2.0
		crackExponent = 0.6
		#Floor on crackThresholdJ (J) -- fragile blocks (blastResist<=0) use this directly.
		# Default: 3.0
		# Range: 0.1 ~ 1000.0
		crackMinJ = 3.0
		#Ceiling on crackThresholdJ (J) -- very blast-resistant blocks (obsidian, etc.) clamp here.
		# Default: 500.0
		# Range: 1.0 ~ 100000.0
		crackMaxJ = 500.0
		#Base term in breakMult = base + blastResist^exponent × coefficient;
		#breakThresholdJ = crackThresholdJ × breakMult.
		# Default: 5.0
		# Range: 0.1 ~ 100.0
		breakBaseMultiplier = 5.0
		#Coefficient in the breakMult formula (see breakBaseMultiplier).
		# Default: 3.0
		# Range: 0.1 ~ 100.0
		breakCoefficient = 3.0
		#Exponent in the breakMult formula (see breakBaseMultiplier).
		# Default: 0.4
		# Range: 0.01 ~ 2.0
		breakExponent = 0.4
		#Material-yield immunity ratio: a victim survives when its own break threshold
		#exceeds the striker's break threshold × this value. Used across world block
		#damage, physics structure damage, penetration, and structure-vs-structure collisions.
		# Default: 1.5
		# Range: 1.0 ~ 10.0
		strikerYieldTolerance = 1.5
		#Structure-vs-structure hardness-split coefficient: the softer body's energy share
		#is coefficient × otherBreakJ / (myBreakJ + otherBreakJ).
		# Default: 2.0
		# Range: 0.1 ~ 10.0
		structureVsStructureSplitCoefficient = 2.0
		#Max contribution of a single neighbor block, relative to the victim's crack threshold.
		# Default: 3.0
		# Range: 0.1 ~ 20.0
		confinementPerFaceCap = 3.0
		#Baseline directional confinement weight (0-1) before the impact-direction bonus.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		confinementDirectionBase = 0.5
		#Amplitude of the impact-direction bonus added to confinementDirectionBase.
		# Default: 0.5
		# Range: 0.0 ~ 1.0
		confinementDirectionAmplitude = 0.5
		#Fraction of raw hydrostatic overburden pressure (density × gravity × depth)
		#that becomes penetration resistance energy. Higher = terrain resists deep
		#drilling sooner. Default 0.15 (the undamped physical value of 1.0 stops
		#penetration within a few blocks for almost any striker).
		# Default: 0.15
		# Range: 0.01 ~ 1.0
		overburdenEfficiency = 0.15
		#Base accumulation threshold (J) for SOFT_SOIL blocks (dirt, sand, gravel, etc.),
		#before the material break multiplier is applied.
		# Default: 5.0
		# Range: 0.1 ~ 10000.0
		softSoilThresholdJ = 5.0
		#Base accumulation threshold (J) for BRITTLE blocks (glass, ice, terracotta).
		# Default: 15.0
		# Range: 0.1 ~ 10000.0
		brittleThresholdJ = 15.0
		#Base accumulation threshold (J) for WOOD blocks (planks, logs).
		# Default: 20.0
		# Range: 0.1 ~ 10000.0
		woodThresholdJ = 20.0
		#Base accumulation threshold (J) for STONE blocks (stone, cobblestone, concrete).
		# Default: 50.0
		# Range: 0.1 ~ 10000.0
		stoneThresholdJ = 50.0
		#Base accumulation threshold (J) for METAL blocks (iron, gold, copper).
		# Default: 120.0
		# Range: 0.1 ~ 10000.0
		metalThresholdJ = 120.0
		#Base accumulation threshold (J) for HIGH_STRENGTH blocks (obsidian, netherite).
		# Default: 300.0
		# Range: 0.1 ~ 10000.0
		highStrengthThresholdJ = 300.0
		#Base accumulation threshold (J) for unclassified (GENERIC) blocks.
		# Default: 40.0
		# Range: 0.1 ~ 10000.0
		genericThresholdJ = 40.0

	#Cosmetic particle/sound feedback rate limiting (CRACKED/CRITICAL states only).
	[advanced.feedback]
		#Minimum ticks between feedback events for the same block position.
		# Default: 10
		# Range: 0 ~ 200
		feedbackCooldownTicks = 10
		#Max feedback events emitted per server tick across all blocks (prevents spam during chain impacts).
		# Default: 16
		# Range: 1 ~ 1000
		feedbackBudgetPerTick = 16

	#Per-tool-tier impact energy thresholds, used when Drop Mode is set to By Force.
	[advanced.mining]
		#Max impact energy (J) that still drops as netherite-pickaxe tier. Only used when dropMode=BY_FORCE.
		# Default: 100.0
		# Range: 0.0 ~ 100000.0
		netheritePickaxeMax = 100.0
		#Max impact energy (J) for diamond-pickaxe-tier drops.
		# Default: 300.0
		# Range: 0.0 ~ 100000.0
		diamondPickaxeMax = 300.0
		#Max impact energy (J) for iron-pickaxe-tier drops.
		# Default: 800.0
		# Range: 0.0 ~ 100000.0
		ironPickaxeMax = 800.0
		#Max impact energy (J) for stone-pickaxe-tier drops.
		# Default: 2000.0
		# Range: 0.0 ~ 100000.0
		stonePickaxeMax = 2000.0
		#Max impact energy (J) for wooden-pickaxe-tier drops. Impacts above this yield no drops (bare hand).
		# Default: 5000.0
		# Range: 0.0 ~ 100000.0
		woodenPickaxeMax = 5000.0

	#Diagnostic logging toggles. High-frequency options generate heavy console output;
	#useful when troubleshooting.
	[advanced.debug]
		#World block collision callback — logs blockId, pos, speed, and thin-block filter
		#result on every collision. Extremely high frequency (one line per contact
		#face, every physics step); suited to short test sessions.
		worldBlockCollisionCallback = false
		#World block damage — full enqueue + apply pipeline: kImpact, confinement factor,
		#blockId, pos, ratio, damage state, and destruction result.
		worldBlockDamageLog = false
		#Physics structure damage — full pipeline: enqueue (plotCp/bodyLocalCp/com/
		#plotCenter), sublevel matching, break attempt (blockId/local coords/ratio/state),
		#and destroy-block result.
		physicsStructureDamageLog = false
		#Dynamic structure damage — full pipeline: contraption search, anchor
		#accumulation/break threshold comparison, train derailment (kImpact/threshold/
		#track beneath), minecart destruction (vehicle type/kImpact).
		dynamicStructureDamageLog = false
		#Raw physics capture — internals of the collision-processing pipeline: pair map
		#size, whether a world contact was seen, snapshot map size. Extremely high
		#frequency, fires every Rapier physics step.
		impactCaptureDetail = false
		#Rigid body snapshots — logs position, linear/angular velocity, mass, center of
		#mass, and rotation quaternion every time a body is sampled. High frequency,
		#one line per active body per physics step.
		rigidBodySnapshot = false
		#Energy summary — one summary line per tick with any collision: event count,
		#kImpact range (min/max/sum), and which damage paths were active. Low frequency,
		#enabled by default.
		energySummary = true
		#Verbose physics structure damage — adds the full per-block calculation path on
		#top of physicsStructureDamageLog: mass, mass-normalization factor, hardness, blast resistance,
		#per-block crack/break threshold, confinement factor, adjusted threshold, current
		#accumulated kImpact, ratio, and damage state. Requires physicsStructureDamageLog also enabled.
		#Disabled by default.
		physicsStructureDamageVerbose = false
