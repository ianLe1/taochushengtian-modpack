debug = false
disable_crowdin = false
check_for_updates = true

[activations.priority]
type = "PUSH_TO_TALK"
toggle = false
[activations.proximity]
type = "PUSH_TO_TALK"
toggle = false
[activations.walkie_talkie]
type = "VOICE"
toggle = false
[activations.whisper]
type = "PUSH_TO_TALK"
toggle = false

[[key_bindings]]
keys = ["key.keyboard.left.alt", "key.keyboard.m"]
name = "key.plasmovoice.general.mute_microphone"
any_context = false
category = "key.plasmovoice.general"

[[key_bindings]]
keys = ["key.keyboard.tab"]
name = "key.plasmovoice.proximity.ptt"
any_context = false
category = "hidden"

[addons.pv-addon-soundphysics]
enabled = true
mic_reverb = true
mic_reverb_volume = 1.0
[addons.wt-addon-client]
radio-effect = true
sfx-volume = 0.3
voice-default = true

[voice]
disabled = false
microphone_disabled = false
activation_threshold = -30.0
input_device = ""
output_device = ""
disable_input_device = false
use_javax_input = false
microphone_volume = 1.0
noise_suppression = false
volume = 1.0
compressor_limiter = true
sound_occlusion = false
directional_sources = false
hrtf = false
stereo_capture = false
show_all_source_lines = false

[voice.volumes.priority]
volume = 1.0
[voice.volumes.proximity]
volume = 1.0
[voice.volumes.voice_messages]
volume = 1.0
[voice.volumes.walkie_talkie]
volume = 1.0
[voice.volumes.whisper]
volume = 1.0

[advanced]
visualize_voice_distance = true
visualize_voice_distance_on_join = false
compressor_threshold = -10
limiter_threshold = -6
directional_sources_angle = 145
stereo_sources_to_mono = false
panning = true
source_types_overlap = "MUTE_PROXIMITY"
camera_sound_listener = true
exponential_volume_slider = true
exponential_distance_gain = true
jitter_packet_delay = 2
al_playback_buffers = 5
adaptive_jitter_buffer = false

[overlay]
show_activation_icon = true
activation_icon_position = "BOTTOM_CENTER"
show_source_icons = 0
show_static_source_icons = true
overlay_enabled = true
overlay_position = "TOP_LEFT"
overlay_style = "NAME_SKIN"

[overlay.source_states]
priority = "OFF"
proximity = "OFF"
voice_messages = "WHEN_TALKING"
walkie_talkie = "OFF"
whisper = "OFF"
