#总开关。关掉之后本模组完全不做任何虚化与删除，
#所有结构的倒计时也停止累计（不会出现「关了一周再打开，一夜之间全被删光」）。
[general]
	#是否启用虚化功能。默认 true。
	#也可以用游戏内指令 /fade set enabled <true|false> 直接切换。
	enabled = true

#虚化节奏。
#一个「物理结构」= 一个 Sable 子维度(SubLevel) / 物理载具。
[timing]
	#多久没有任何互动之后，开始虚化（秒）。默认 600 秒 = 10 分钟。
	# Default: 600
	# Range: > 0
	idleSecondsBeforeFade = 600
	#从「开始虚化」到「完全透明并被删除」的时长（秒）。默认 300 秒 = 5 分钟。
	#所以默认情况下，一个结构从最后一次互动算起，15 分钟后会消失。
	# Default: 300
	# Range: > 1
	fadeDurationSeconds = 300
	#服务端多久检查一次所有物理结构（tick）。默认 20 = 1 秒。
	#调大可省性能，调小则虚化进度更平滑。
	# Default: 20
	# Range: 1 ~ 72000
	checkIntervalTicks = 20

#哪些行为可以打断虚化（并立刻把进度重置为 0）。
#默认只开启「放置/破坏方块」和「玩家站在结构上」两种；
#「运动」默认关闭，因为停在水面上的船会一直轻微晃动，开了就等于永不虚化。
[interrupt]
	#结构上的方块发生变化时打断虚化。默认开启。
	#注意：这条不区分是玩家操作还是运转中的机械 —— 这是刻意的，
	#因为「机械还在动」本身就说明这个结构还活着，不该删。
	#反例：风车 / 水车 / 创造马达不需要燃料，废弃了也不会停，
	#遇到这种情况把本项关掉（只靠「玩家站在结构上」判定）。
	onBlockChange = true
	#有玩家站在（或骑在）物理结构上时打断虚化。默认开启。
	onPlayerStanding = true
	#物理结构自身发生位移或旋转时打断虚化。默认关闭。
	onMovement = false
	#判定「发生了移动」的位移阈值（方块）。仅在 onMovement 开启时有效。
	# Default: 0.05
	# Range: 0.0 ~ 64.0
	movementTranslationTolerance = 0.05
	#判定「发生了旋转」的角度阈值。仅在 onMovement 开启时有效。
	# Default: 0.02
	# Range: 0.0 ~ 3.15
	movementRotationTolerance = 0.02

#铭牌（Nameplate）相关的判定。
[nameplate]
	#是否额外确认「铭牌方块真的还在结构上」。默认开启。
	#原版实现：铭牌被编辑时会把名字写进子维度(SubLevel.setName)，
	#但铭牌被破坏时并不会把名字清掉 —— 也就是说名字会变成「幽灵名字」。
	#开启本项后，本模组会定期扫描结构，确认确实存在一个带名字的铭牌方块；
	#如果铭牌已经被打掉，结构就会重新开始虚化倒计时。
	#关闭它可以省掉这次扫描，但被打掉铭牌的结构将永远不会虚化。
	verifyNameplateStillExists = true
	#上面的扫描多久做一次（tick）。默认 100 = 5 秒。
	# Default: 100
	# Range: 20 ~ 72000
	nameplateScanIntervalTicks = 100

#质量阈值：质量达到或超过阈值的结构不会虚化。
#【0 = 此功能关闭】，也就是默认行为：
#不管多大的结构，只要没铭牌、太久没互动，一样会虚化消失。
[mass]
	#质量阈值（单位 kpg，和 Sable 的 sable:mass 同一单位）。
	#0 表示关闭这个功能（默认）。
	#参考：Sable 里一个普通方块的默认质量是 1.0 kpg。
	# Default: 0.0
	# Range: 0.0 ~ 1.7976931348623157E308
	massThreshold = 0.0

#杂项。
[misc]
	#即使进度没变化，也每隔这么久向客户端重发一次状态（tick）。
	#用于让后进入视野 / 后登录的玩家也能看到正确的透明度。默认 200 = 10 秒。
	# Default: 200
	# Range: 20 ~ 72000
	resyncIntervalTicks = 200
	#向结构周围多大半径内的玩家同步虚化进度（方块）。
	# Default: 512.0
	# Range: 64.0 ~ 4096.0
	syncRadius = 512.0
	#是否在日志里记录「开始虚化 / 结构被删除 / 倒计时被重置」这类事件。
	#默认【关闭】—— 本模组的定位是「装上之后几乎感觉不到它存在」，
	#服务器上每天清理垃圾如果都写日志，控制台会被刷满。
	#需要排查时再打开，或者用 /fade list 与 /fade why 按需查看。
	logFadeEvents = false
