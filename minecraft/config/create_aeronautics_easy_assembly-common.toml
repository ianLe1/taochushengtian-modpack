#Whether to log the dirt block on common setup
logDirtBlock = true
#A magic number
# Default: 42
# Range: > 0
magicNumber = 42
#What you want the introduction message to be for the magic number
magicNumberIntroduction = "The magic number is... "
#A list of items to log on common setup.
items = ["minecraft:iron_ingot"]
#If true, the Chisel cannot disassemble physics structures that are moving too fast.
#If false, the linear/angular velocity checks are skipped (useful for cleaning up stuck vehicles).
#Note: Disabling this may cause physics engine crashes or scattered blocks.
chiselDisassemblySpeedCheck = true
