["枪械伤害计算设置"]
	#枪械伤害计算模式
	#ONLY_SPECIFIC: 仅使用专属枪械伤害加成
	#ONLY_GENERIC: 仅使用通用枪械伤害加成
	#MULTIPLY: 通用伤害 × 专属伤害（默认）
	#Allowed Values: ONLY_SPECIFIC, ONLY_GENERIC, MULTIPLY
	damageCalculationMode = "MULTIPLY"

["暴击属性显示设置"]
	#暴击率属性完整ID（格式：命名空间:属性名）
	#默认: apothic_attributes:crit_chance
	#示例: last_one:crit_chance
	critChanceAttribute = "apothic_attributes:crit_chance"
	#暴击伤害属性完整ID（格式：命名空间:属性名）
	#默认: apothic_attributes:crit_damage
	#示例: last_one:crit_damage
	critDamageAttribute = "apothic_attributes:crit_damage"

["多语言显示设置"]
	#显示语言选择
	#ZH: 中文
	#EN: 英文
	#Allowed Values: ZH, EN
	displayLanguage = "ZH"
	#暴击率显示名称（中文）
	critChanceNameZh = "暴击率"
	#暴击伤害显示名称（中文）
	critDamageNameZh = "暴击伤害"
	#暴击率显示名称（英文）
	critChanceNameEn = "Critical Chance"
	#暴击伤害显示名称（英文）
	critDamageNameEn = "Critical Damage"
